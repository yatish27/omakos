name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes make shellcheck shfmt zsh ruby jq openssh-client python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Gitleaks (checksum verified)
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
      - run: make check
